[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nebby-core = { path = "crates/nebby-core" }
nebby-desktop = { path = "crates/nebby-desktop" }

[profile.dev]
debug = 0

