[package]
name = "pokemon3ds-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
native-input = []
host-audio = ["dep:cpal"]
host-gamepad = ["dep:gilrs"]

[dependencies]
recomp3ds = { path = "../../../../tools/external/3dsrecomp", default-features = false }
recomp-abi = { path = "../../../../tools/external/3dsrecomp/abi", features = ["load"] }
log = "0.4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = { version = "0.16", optional = true }
gilrs = { version = "0.11.2", optional = true }

[workspace]
